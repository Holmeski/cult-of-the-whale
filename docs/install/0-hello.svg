<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Raistlin, a skeleton mage with a burning hat, introduces the two addons">
<rect width="960" height="380" rx="22" fill="#17121d"/>
<rect x="318" y="76" width="620" height="282" rx="16" fill="#231a2c"/>
<circle cx="40" cy="60" r="3" fill="#ff8a1f" opacity="0.7"/>
<circle cx="250" cy="110" r="2" fill="#ff8a1f" opacity="0.7"/>
<circle cx="285" cy="40" r="2.5" fill="#ff8a1f" opacity="0.7"/>
