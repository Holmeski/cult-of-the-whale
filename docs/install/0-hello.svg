<text x="330" y="52" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#f4ead9" font-weight="800" text-anchor="start">Raistlin's install guide</text>
<text x="350" y="130" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#f4ead9" font-weight="800" text-anchor="start">Two addons. Six steps.</text><text x="350" y="172" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#b7a9c4" font-weight="400" text-anchor="start">No fire required. (He will offer anyway.)</text><path d="M360,215 h42.48 l12,12 h63.519999999999996 v70 h-118 Z" fill="#e7b84b"/><rect x="360" y="229" width="118" height="62" rx="6" fill="#e7b84b" stroke="#00000033"/><text x="419.0" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a1a10">ZQuest</text><text x="419.0" y="313" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b7a9c4">leveling guide</text><path d="M520,215 h42.48 l12,12 h63.519999999999996 v70 h-118 Z" fill="#e7b84b"/><rect x="520" y="229" width="118" height="62" rx="6" fill="#e7b84b" stroke="#00000033"/><text x="579.0" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a1a10">ZDungeon</text><text x="579.0" y="313" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b7a9c4">dungeon planner</text>
<path d="M52,110.85000000000001 L24,142.85000000000002 L88,110.85000000000001 Z" fill="#f4ead9"/><rect x="18" y="14" width="286" height="98.85000000000001" rx="18" fill="#f4ead9"/><text x="38" y="44.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1b1220" font-weight="600">Hi! I'm Raistlin. I'm dead,</text><text x="38" y="66.95" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1b1220" font-weight="600">I'm a mage, and I have never</text><text x="38" y="89.9" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1b1220" font-weight="600">started a fire on purpose.</text>
