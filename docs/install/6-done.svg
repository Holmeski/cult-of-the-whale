<text x="350" y="51" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#1b1220" font-weight="800" text-anchor="middle">6</text>
<text x="388" y="52" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#f4ead9" font-weight="800" text-anchor="start">You're done!</text>
<text x="350" y="118" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#b7a9c4" font-weight="400" text-anchor="start">Type one of these in chat and press Enter:</text><rect x="356" y="156" width="110" height="46" rx="8" fill="#0f0b14" stroke="#ff8a1f" stroke-width="2"/><text x="411" y="187" font-family="Consolas, Menlo, monospace" font-size="24" fill="#ffd34d" font-weight="800" text-anchor="middle">/zq</text><text x="486" y="187" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#f4ead9" font-weight="600" text-anchor="start">ZQuest: your leveling guide</text><rect x="356" y="232" width="110" height="46" rx="8" fill="#0f0b14" stroke="#ff8a1f" stroke-width="2"/><text x="411" y="263" font-family="Consolas, Menlo, monospace" font-size="24" fill="#ffd34d" font-weight="800" text-anchor="middle">/zd</text><text x="486" y="263" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#f4ead9" font-weight="600" text-anchor="start">ZDungeon: dungeon quests, gear, travel</text><text x="350" y="344" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#b7a9c4" font-weight="400" text-anchor="start">Nothing shows up? Go back to step 4. It is always step 4.</text>
<path d="M52,110.85000000000001 L24,142.85000000000002 L88,110.85000000000001 Z" fill="#f4ead9"/><rect x="18" y="14" width="286" height="98.85000000000001" rx="18" fill="#f4ead9"/><text x="38" y="44.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1b1220" font-weight="600">That's it! Now if you'll</text><text x="38" y="66.95" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1b1220" font-weight="600">excuse me, something is on</text><text x="38" y="89.9" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1b1220" font-weight="600">fire. It's me. It's fine.</text>
